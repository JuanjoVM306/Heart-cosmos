<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Magnetic Hearts</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #05020a;
            overflow: hidden;
            font-family: 'Georgia', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #ui {
            position: absolute;
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
            width: 100%;
            padding: 0 15px;
            transition: opacity 0.6s ease;
        }
        #ui.fade-out {
            opacity: 0;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 4px 0;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ff9f1c 0%, #9d4edd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
        }
        p {
            font-size: 0.75rem;
            opacity: 0.6;
            margin: 0;
            letter-spacing: 0.8px;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Cosmic Hearts</h1>
        <p>Une los núcleos para revelar el secreto</p>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const uiElement = document.getElementById('ui');

        let width, height, dpr;

        // --- Configuración del Poema ---
        const poemText = "Quiero pedirte perdón si mi forma de expresarme te llegó a abrumar,\nsi con mis detalles e intensidad no te dejé tranquila respirar.\nSabes muy bien que no suelo ser así con nadie más en mi vida,\npero contigo mi verdadero sentir encontró una clara salida.\n\nNo vengo a pedirte respuestas ni a volver a presionar,\nentiendo que tu corazón necesita tiempo y espacio para sanar.\nMis palabras ya te dijeron la promesa que elegí sostener,\ny mi postura no ha cambiado, no hay nada que temer.\n\nTe esperaré en este rincón del universo con paciencia y calma,\nrespetando tus procesos y cuidando el espacio de tu alma.\nSolo el tiempo, una palabra tuya o un nuevo destino en tu camino\npodrán cambiar la certeza de lo que hoy por ti siento y convino.\n\nMe quedo tranquilo observando cómo vuelves a brillar,\nsabiendo que lo que es verdadero... jamás se necesita forzar.";

        const fontSize = 17;
        let lineHeight;
        let lines;

        function resize() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;

            // Ajustar resolución interna del canvas para evitar estiramientos en GitHub Pages
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            ctx.scale(dpr, dpr);

            lineHeight = fontSize * 1.35;
            ctx.font = `${fontSize}px Georgia, serif`;
            lines = wrapText(poemText, width * 0.85);
        }
        window.addEventListener('resize', resize);
        resize();

        function wrapText(text, maxWidth) {
            let wrappedLines = [];
            const paragraphs = text.split('\n');
            paragraphs.forEach(paragraph => {
                if (paragraph.length === 0) {
                    wrappedLines.push("");
                    return;
                }
                let words = paragraph.split(' ');
                let currentLine = words[0];

                for (let i = 1; i < words.length; i++) {
                    let word = words[i];
                    let widthMeasure = ctx.measureText(currentLine + " " + word).width;
                    if (widthMeasure < maxWidth) {
                        currentLine += " " + word;
                    } else {
                        wrappedLines.push(currentLine);
                        currentLine = word;
                    }
                }
                wrappedLines.push(currentLine);
            });
            return wrappedLines;
        }

        function drawStaticPoem() {
            ctx.fillStyle = '#d1b3ff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `${fontSize}px Georgia, serif`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#9d4edd';

            const totalHeight = lines.length * lineHeight;
            let startY = (height - totalHeight) / 2 + lineHeight / 2 + 10;

            lines.forEach((line, index) => {
                ctx.fillText(line, width / 2, startY + index * lineHeight);
            });
            
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
        }

        // Nodos magnéticos con estilo único
        const nodeA = {
            x: width * 0.38,
            y: height * 0.58,
            targetX: width * 0.38,
            targetY: height * 0.58,
            radius: 24,
            color: '#ff9f1c',
            isDragging: false
        };

        const nodeB = {
            x: width * 0.62,
            y: height * 0.58,
            targetX: width * 0.62,
            targetY: height * 0.58,
            radius: 24,
            color: '#9d4edd',
            isDragging: false
        };

        let activeNode = null;
        let activeTouchId = null;

        // Partículas estelares
        const particleCount = 1300;
        const particles = [];

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.angle = Math.random() * Math.PI * 2;
                this.baseRadius = Math.random() * 70 + 25;
                this.speed = Math.random() * 0.025 + 0.008;
                this.size = Math.random() * 1.8 + 0.4;
                this.alpha = Math.random() * 0.8 + 0.2;
                this.assigned = Math.random() > 0.5 ? 'A' : 'B';
                this.color = Math.random() > 0.4 ? '#ffffff' : (Math.random() > 0.5 ? '#ff9f1c' : '#c77dff');
            }

            update(connected, cx, cy) {
                if (connected) {
                    this.angle += this.speed * 1.3;
                    let t = this.angle;
                    
                    let hx = 16 * Math.pow(Math.sin(t), 3);
                    let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    
                    let targetX = cx + hx * 8.5;
                    let targetY = cy + hy * 8.5;

                    this.x += (targetX - this.x) * 0.09;
                    this.y += (targetY - this.y) * 0.09;
                } else {
                    let node = this.assigned === 'A' ? nodeA : nodeB;
                    this.angle += this.speed;

                    let orbitX = node.x + Math.cos(this.angle) * this.baseRadius;
                    let orbitY = node.y + Math.sin(this.angle) * this.baseRadius;

                    this.x += (orbitX - this.x) * 0.12;
                    this.y += (orbitY - this.y) * 0.12;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // --- Gestión unificada de Puntero / Táctil ---
        function onPointerDown(e) {
            let clientX, clientY, touchId = null;

            if (e.touches && e.touches.length > 0) {
                const touch = e.touches[e.touches.length - 1];
                clientX = touch.clientX;
                clientY = touch.clientY;
                touchId = touch.identifier;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const distA = Math.hypot(clientX - nodeA.x, clientY - nodeA.y);
            const distB = Math.hypot(clientX - nodeB.x, clientY - nodeB.y);

            if (distA < nodeA.radius * 2.5) {
                activeNode = nodeA;
                nodeA.isDragging = true;
                activeTouchId = touchId;
            } else if (distB < nodeB.radius * 2.5) {
                activeNode = nodeB;
                nodeB.isDragging = true;
                activeTouchId = touchId;
            }
        }

        function onPointerMove(e) {
            if (!activeNode) return;
            let clientX, clientY;

            if (e.touches) {
                let found = false;
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === activeTouchId) {
                        clientX = e.touches[i].clientX;
                        clientY = e.touches[i].clientY;
                        found = true;
                        break;
                    }
                }
                if (!found) return;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            const margin = activeNode.radius + 10;
            const topMargin = activeNode.radius + 40;
            
            const clampedX = Math.max(margin, Math.min(width - margin, clientX));
            const clampedY = Math.max(topMargin, Math.min(height - margin, clientY));

            activeNode.targetX = clampedX;
            activeNode.targetY = clampedY;
        }

        function onPointerUp(e) {
            if (e.touches) {
                let stillActive = false;
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === activeTouchId) {
                        stillActive = true;
                        break;
                    }
                }
                if (stillActive) return;
            }

            if (activeNode) {
                activeNode.isDragging = false;
                activeNode = null;
                activeTouchId = null;
            }
        }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        window.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);
        window.addEventListener('touchcancel', onPointerUp);

        function defineHeartMask(ctx, cx, cy, scale) {
            ctx.beginPath();
            let steps = 100;
            for (let i = 0; i < steps; i++) {
                let t = (i / steps) * Math.PI * 2;
                let hx = 16 * Math.pow(Math.sin(t), 3);
                let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                let x = cx + hx * scale;
                let y = cy + hy * scale;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 2, 10, 0.28)';
            ctx.fillRect(0, 0, width, height);

            nodeA.x += (nodeA.targetX - nodeA.x) * 0.2;
            nodeA.y += (nodeA.targetY - nodeA.y) * 0.2;
            nodeB.x += (nodeB.targetX - nodeB.x) * 0.2;
            nodeB.y += (nodeB.targetY - nodeB.y) * 0.2;

            const distance = Math.hypot(nodeA.x - nodeB.x, nodeA.y - nodeB.y);
            const connectionThreshold = 75;
            const isConnected = distance < connectionThreshold;

            let centerX = (nodeA.x + nodeB.x) / 2;
            let centerY = (nodeA.y + nodeB.y) / 2;

            if (isConnected) {
                uiElement.classList.add('fade-out');
            } else {
                uiElement.classList.remove('fade-out');
            }

            if (isConnected) {
                if (!nodeA.isDragging) {
                    nodeA.targetX += (centerX - nodeA.targetX) * 0.3;
                    nodeA.targetY += (centerY - nodeA.targetY) * 0.3;
                }
                if (!nodeB.isDragging) {
                    nodeB.targetX += (centerX - nodeB.targetX) * 0.3;
                    nodeB.targetY += (centerY - nodeB.targetY) * 0.3;
                }

                ctx.save();
                defineHeartMask(ctx, centerX, centerY, 8.5);
                ctx.clip();
                drawStaticPoem();
                ctx.restore();
            }

            particles.forEach(p => {
                p.update(isConnected, centerX, centerY);
                p.draw();
            });

            // Nodo B (Violeta)
            ctx.save();
            ctx.shadowBlur = 30;
            ctx.shadowColor = nodeB.color;
            ctx.fillStyle = nodeB.color;
            ctx.beginPath();
            ctx.arc(nodeB.x, nodeB.y, nodeB.radius * 0.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(nodeB.x, nodeB.y, nodeB.radius, 0, Math.PI * 2);
            ctx.stroke();

            // Nodo A (Ámbar) - Encima
            ctx.save();
            ctx.shadowBlur = 30;
            ctx.shadowColor = nodeA.color;
            ctx.strokeStyle = nodeA.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(nodeA.x, nodeA.y, nodeA.radius * 1.3, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = nodeA.color;
            ctx.beginPath();
            ctx.arc(nodeA.x, nodeA.y, nodeA.radius * 0.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(nodeA.x, nodeA.y, nodeA.radius * 0.25, 0, Math.PI * 2);
            ctx.fill();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
